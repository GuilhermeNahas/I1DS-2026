<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script | HTML</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <h1>HTML Dinâmico com Java script</h1>
    <div class="card">
        <h2>Exercicio 01</h2>
        <h3>Contador Simples</h3>
        <p>
            <span>Objetivo:</span>
            Criar um contador com botão +1 botão -1 e Reset
        </p>
    </div>
    <div id="ex01">
        <h3>Contador</h3>
        <p id="contador">0</p>
        <div class="grupo-botoes">
            <button id="menos" onclick="diminuir()">-1</button>
            <button id="zerar" onclick="zerar()">Zerar</button>
            <button id="mais" onclick="adicionar()">+1</button>
        </div>
    </div>



    <script src="js/script.js"></script>

</body>
</html>
